name: Claude Opus code review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare diff
        id: diff
        shell: bash
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git diff --no-ext-diff --unified=3 "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > review-diff.txt
          else
            git diff --no-ext-diff --unified=3 HEAD~1 HEAD > review-diff.txt || true
          fi
          if [ ! -s review-diff.txt ]; then
            echo "No code changes to review." > review-diff.txt
          fi
          # Avoid sending an unbounded patch to the API.
          head -c 90000 review-diff.txt > review-diff-limited.txt

      - name: Ask Claude Opus to review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY GitHub secret is missing." > claude-review.md
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          diff = Path("review-diff-limited.txt").read_text(errors="replace")
          prompt = """Ты — независимый senior Android/Kotlin reviewer проекта ASHEN LEGACY.
          Проверь diff на реальные ошибки компиляции, runtime/crash, логику игры,
          Android lifecycle, производительность и безопасность. Не выдумывай проблемы.
          Сначала перечисли критические ошибки с файлами/строками, затем важные замечания,
          затем кратко укажи, если серьёзных проблем не найдено. Не меняй код и не утверждай,
          что запускал тесты, если это не подтверждено. Отвечай по-русски.
          
          DIFF:
          """ + diff
          Path("claude-request.json").write_text(json.dumps({
              "model": "claude-opus-5-5",
              "max_tokens": 5000,
              "messages": [{"role": "user", "content": prompt}]
          }, ensure_ascii=False))
          PY
          curl --fail-with-body --silent --show-error https://api.anthropic.com/v1/messages             -H "content-type: application/json"             -H "anthropic-version: 2026-10-21"             -H "authorization: Bearer $ANTHROPIC_API_KEY"             --data-binary @claude-request.json             -o claude-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("claude-response.json").read_text())
          text = "\n".join(x.get("text", "") for x in data.get("content", []) if x.get("type") == "text")
          Path("claude-review.md").write_text("# Проверка Claude Opus\n\n" + (text or "Claude вернул пустой ответ."))
          PY

      - name: Comment review on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('claude-review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-opus-review
          path: claude-review.md
          if-no-files-found: warn
